<!doctype html>
<meta charset="utf-8"><title>Neon Zone Royale</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#06060f;color:#e6e6ff;font-family:'Courier New',monospace;text-align:center;overflow-x:hidden}

  /* ---------------- menu screen: neon cyberpunk city ---------------- */
  #menu{
    position:relative;width:100%;height:100vh;min-height:600px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(0,255,255,.10), transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(255,0,170,.12), transparent 55%),
      linear-gradient(#050510, #0a0a1f 55%, #0d0d26);
    overflow:hidden;
  }
  /* procedurally generated skyline, two parallax layers */
  #menu::before, #menu::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:60%;
    background-repeat:repeat-x;background-position:bottom;
  }
  #menu::before{
    opacity:.55; height:48%;
    background-image: repeating-linear-gradient(90deg,
      #11112a 0 38px, #0d0d22 38px 40px, transparent 40px 90px);
    -webkit-mask-image: linear-gradient(0deg, #000 60%, transparent 100%);
            mask-image: linear-gradient(0deg, #000 60%, transparent 100%);
  }
  #menu::after{
    height:62%;
    background-image: repeating-linear-gradient(90deg,
      #191942 0 60px, #141435 60px 64px, transparent 64px 150px);
    -webkit-mask-image: linear-gradient(0deg, #000 55%, transparent 100%);
            mask-image: linear-gradient(0deg, #000 55%, transparent 100%);
  }
  #winCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  #menuContent{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 16px}
  #title1,#title2{
    margin:0;font-weight:900;letter-spacing:6px;font-size:clamp(28px,6vw,58px);line-height:1.05;
    text-transform:uppercase;
  }
  #title1{color:#ff3bd4;text-shadow:0 0 6px #ff3bd4,0 0 22px #ff3bd4,0 0 46px #b0009f;}
  #title2{color:#2be8ff;text-shadow:0 0 6px #2be8ff,0 0 22px #2be8ff,0 0 46px #0096a8;}
  #subtitle{
    margin:2px 0 26px;color:#bfe9ff;letter-spacing:10px;font-size:13px;font-weight:bold;
    text-shadow:0 0 8px rgba(100,220,255,.6);
  }

  .neonField{
    display:flex;align-items:center;gap:10px;width:min(360px,80vw);
    background:rgba(8,10,26,.75);border:2px solid #2be8ff;border-radius:8px;
    padding:12px 16px;margin-bottom:16px;box-shadow:0 0 14px rgba(43,232,255,.35), inset 0 0 10px rgba(43,232,255,.08);
  }
  .neonField svg{flex:none;width:20px;height:20px}
  #nameIn{
    flex:1;background:transparent;border:none;outline:none;color:#eafcff;
    font-family:inherit;font-size:16px;letter-spacing:2px;text-transform:uppercase;
  }
  #nameIn::placeholder{color:#5f7a92}

  #joinBtn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:min(360px,80vw);padding:16px;font-family:inherit;font-weight:900;font-size:20px;letter-spacing:4px;
    color:#0ff;background:rgba(8,10,26,.75);border:2px solid #2be8ff;border-radius:8px;cursor:pointer;
    box-shadow:0 0 16px rgba(43,232,255,.45), inset 0 0 12px rgba(43,232,255,.12);
    transition:transform .12s, box-shadow .12s;
  }
  #joinBtn svg{width:22px;height:22px}
  #joinBtn:hover:not(:disabled){transform:scale(1.03);box-shadow:0 0 26px rgba(43,232,255,.8), inset 0 0 16px rgba(43,232,255,.25)}
  #joinBtn:disabled{opacity:.35;cursor:default}
  #menuMsg{min-height:20px;color:#ff5a7a;font-size:13px;letter-spacing:1px;margin-top:4px}

  /* ---------------- in-game screen ---------------- */
  #game{display:none}
  #wrap{display:inline-block;margin-top:10px}
  canvas#c{background:#10102a;border:3px solid #0ff;border-radius:4px;image-rendering:pixelated}
  #ui{margin:8px;display:flex;gap:8px;justify-content:center;align-items:center}
  #readyBtn{font-family:inherit;font-size:14px;padding:6px 14px;border-radius:4px;border:2px solid #0ff;background:#10102a;color:#e6e6ff;cursor:pointer}
  #readyBtn:hover{background:#0ff;color:#10102a}
</style>

<div id="menu">
  <canvas id="winCanvas"></canvas>
  <div id="menuContent">
    <h1 id="title1">Neon Zone</h1>
    <h1 id="title2">Royale</h1>
    <div id="subtitle">BATTLE ROYALE</div>

    <label class="neonField">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2be8ff" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <input id="nameIn" placeholder="ENTER NICKNAME" maxlength="16">
    </label>

    <button id="joinBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0ff" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="5"/><path d="M7 12h.01M9 10v4"/><circle cx="16" cy="10.5" r="1"/><circle cx="18" cy="13" r="1"/></svg>
      PLAY
    </button>
    <div id="menuMsg"></div>
  </div>
</div>

<div id="game">
  <div id="wrap">
    <div id="ui"><button id="readyBtn" disabled>READY</button></div>
    <canvas id="c" width="800" height="600"></canvas>
  </div>
</div>

<script>
// --- animated neon city "windows" sparkle on the menu background ---
(function cityLights(){
  const wc = document.getElementById('winCanvas');
  function size(){ wc.width = innerWidth; wc.height = innerHeight; }
  size(); addEventListener('resize', size);
  const wctx = wc.getContext('2d');
  const dots = Array.from({length:70}, () => ({
    x: Math.random(), y: 0.45 + Math.random()*0.5,
    c: Math.random() < 0.5 ? '#2be8ff' : '#ff3bd4',
    p: Math.random()*Math.PI*2, s: 1 + Math.random()*2,
  }));
  function tick(t){
    wctx.clearRect(0,0,wc.width,wc.height);
    for(const d of dots){
      const a = 0.25 + 0.75*Math.abs(Math.sin(t/900 + d.p));
      wctx.fillStyle = d.c; wctx.globalAlpha = a*0.8;
      wctx.fillRect(d.x*wc.width, d.y*wc.height, d.s, d.s*2);
    }
    wctx.globalAlpha = 1;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
<script>
const S = 0.5; // world 1600x1200 -> canvas 800x600
const c = document.getElementById('c'), g = c.getContext('2d');
g.imageSmoothingEnabled = false;
let ws, me = null, snap = null, lobby = [], isReady = false, state = 'menu', msg = '', firing = false, angle = 0;
const keys = {}; let lastMove = '';
const send = (command, data = {}) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ command, ts: Date.now(), data }));

// ---------- pixel-art sprites (drawn in code, no external images) ----------
// 8 x 12 grid: . transparent, B = body, S = skin/face, E = eye/visor
const SPRITE_ROWS = [
  "..BBBB..",
  ".BBBBBB.",
  ".BSSSSB.",
  ".BSEESB.",
  ".BSSSSB.",
  "..BBBB..",
  "...BB...",
  "..BBBB..",
  ".BBBBBB.",
  ".B.BB.B.",
  ".B.BB.B.",
  "...BB...",
];
function buildSprite(bodyColor, skinColor, eyeColor) {
  const w = SPRITE_ROWS[0].length, h = SPRITE_ROWS.length, px = 4; // 4px per pixel-art cell
  const off = document.createElement('canvas');
  off.width = w * px; off.height = h * px;
  const octx = off.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const ch = SPRITE_ROWS[y][x];
    if (ch === '.') continue;
    octx.fillStyle = ch === 'B' ? bodyColor : ch === 'S' ? skinColor : eyeColor;
    octx.fillRect(x * px, y * px, px, px);
  }
  return off;
}
const spriteMe = buildSprite('#17e06b', '#e8ffe8', '#0a3');
const spriteOther = buildSprite('#ff3b7f', '#ffe8f0', '#700');
const SPR_W = SPRITE_ROWS[0].length * 4, SPR_H = SPRITE_ROWS.length * 4;

// ---------- pixel ground tile (checkerboard, built once) ----------
const tile = document.createElement('canvas'); tile.width = 32; tile.height = 32;
{ const tx = tile.getContext('2d');
  tx.fillStyle = '#141432'; tx.fillRect(0, 0, 32, 32);
  tx.fillStyle = '#1a1a3c'; tx.fillRect(0, 0, 16, 16); tx.fillRect(16, 16, 16, 16);
  tx.strokeStyle = '#22224a'; tx.strokeRect(0, 0, 32, 32); }
const groundPattern = g.createPattern(tile, 'repeat');

const menuEl = document.getElementById('menu'), gameEl = document.getElementById('game'), menuMsgEl = document.getElementById('menuMsg');

joinBtn.onclick = () => {
  const name = nameIn.value.trim();
  if (!name) { menuMsgEl.textContent = 'Enter a nickname first'; nameIn.focus(); return; }
  joinBtn.disabled = true; nameIn.disabled = true; menuMsgEl.textContent = '';
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send('join_game', { name });
  ws.onmessage = e => on(JSON.parse(e.data));
  ws.onclose = () => {
    state = 'menu'; menuEl.style.display = 'flex'; gameEl.style.display = 'none';
    joinBtn.disabled = false; nameIn.disabled = false; menuMsgEl.textContent = 'Disconnected';
  };
  state = 'lobby';
  menuEl.style.display = 'none'; gameEl.style.display = 'block';
  readyBtn.disabled = false;
};
readyBtn.onclick = () => { isReady = !isReady; readyBtn.textContent = isReady ? 'CANCEL' : 'READY'; send('set_ready', { ready: isReady }); };

function on({ event, data }) {
  if (event === 'player_welcomed') me = data.playerId;
  else if (event === 'lobby_updated') lobby = data.players;
  else if (event === 'match_started') { state = 'play'; msg = ''; snap = null; }
  else if (event === 'state_updated') snap = data;
  else if (event === 'player_eliminated' && data.victimId === me) msg = `You were eliminated (#${data.placement})`;
  else if (event === 'match_ended') {
    state = 'lobby'; isReady = false; readyBtn.textContent = 'READY';
    const w = data.results.find(r => r.id === data.winnerId);
    msg = data.winnerId === me ? 'YOU WIN!' : `Winner: ${w ? w.name : '-'}`;
  } else if (event === 'command_rejected') msg = data.message;
}

addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; sendMove(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; sendMove(); });
function sendMove() {
  const dx = (keys.d ? 1 : 0) - (keys.a ? 1 : 0), dy = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
  if (dx + ',' + dy !== lastMove) { lastMove = dx + ',' + dy; send('move', { dx, dy }); }
}
c.onmousemove = e => {
  const r = c.getBoundingClientRect(), p = snap && snap.players.find(p => p.id === me);
  if (p) { angle = Math.atan2(e.clientY - r.top - p.y * S, e.clientX - r.left - p.x * S); send('aim', { angle }); }
};
c.onmousedown = () => firing = true;
addEventListener('mouseup', () => firing = false);
setInterval(() => firing && state === 'play' && send('fire_weapon', { angle }), 100);

function drawGround() {
  g.fillStyle = groundPattern; g.fillRect(0, 0, 800, 600);
}

function draw() {
  g.clearRect(0, 0, 800, 600);
  g.textAlign = 'center';

  if (state === 'lobby') {
    drawGround();
    g.font = 'bold 20px monospace'; g.fillStyle = '#0ff';
    g.fillText('LOBBY', 400, 50);
    g.font = '13px monospace'; g.fillStyle = '#9ad';
    g.fillText('2-8 players \u2013 everyone must press READY', 400, 75);
    g.font = '15px monospace';
    lobby.forEach((p, i) => {
      g.fillStyle = p.ready ? '#17e06b' : '#fff';
      g.fillText(`${p.name}  ${p.ready ? '[READY]' : '...'}`, 400, 120 + i * 24);
    });
  } else if (state === 'play' && snap) {
    drawGround();
    g.strokeStyle = '#0ff'; g.lineWidth = 3; g.beginPath();
    g.arc(snap.zone.cx * S, snap.zone.cy * S, snap.zone.r * S, 0, Math.PI * 2); g.stroke();

    g.fillStyle = '#ff0'; snap.bullets.forEach(b => g.fillRect(b.x * S - 2, b.y * S - 2, 4, 4));

    snap.players.filter(p => p.alive).forEach(p => {
      const img = p.id === me ? spriteMe : spriteOther;
      g.save();
      g.translate(p.x * S, p.y * S);
      g.rotate(p.angle || 0);
      g.drawImage(img, -SPR_W / 2, -SPR_H / 2);
      g.restore();
      g.fillStyle = '#300'; g.fillRect(p.x * S - 13, p.y * S - SPR_H / 2 - 9, 26, 4);
      g.fillStyle = p.hp > 40 ? '#17e06b' : '#f33'; g.fillRect(p.x * S - 12, p.y * S - SPR_H / 2 - 8, 24 * p.hp / 100, 2);
      g.fillStyle = '#fff'; g.font = '11px monospace'; g.fillText(p.name, p.x * S, p.y * S - SPR_H / 2 - 14);
    });

    g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = '14px monospace';
    g.fillText(`Alive: ${snap.alive}`, 10, 22);
    g.textAlign = 'center';
  }

  if (msg) {
    g.font = 'bold 22px monospace'; g.fillStyle = '#ff0';
    g.fillText(msg, 400, state === 'play' ? 300 : 460);
  }
  requestAnimationFrame(draw);
}
draw();
</script>
